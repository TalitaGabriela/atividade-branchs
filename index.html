<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Atividade Branchs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Atividade Branchs</h1>

  <section id="contador">
    <h2>Contador de cliques</h2>
    <p>Cliques: <span id="contador-valor">0</span></p>
    <button id="contador-botao">Clicar</button>
  </section>

  <button id="modo-escuro-botao">Alternar modo escuro</button>

  <section id="contato">
    <h2>Formulário de contato</h2>
    <form id="form-contato">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required>

      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="mensagem" required></textarea>

      <button type="submit">Enviar</button>
      <p id="form-contato-erro" class="erro"></p>
    </form>
  </section>

  <section id="tarefas">
    <h2>Lista de tarefas</h2>
    <form id="form-tarefa">
      <input type="text" id="tarefa-input" placeholder="Nova tarefa">
      <button type="submit">Adicionar</button>
    </form>
    <input type="text" id="tarefa-busca" placeholder="Buscar tarefa">
    <ul id="lista-tarefas"></ul>
  </section>

  <script src="script.js"></script>
</body>
</html>
